version: '3.8'

services:
  mariadb:
    image: mariadb:11
    container_name: e_utilities_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: e_utilities_cost
      MYSQL_USER: ${DB_USER:-appuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-apppass}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: e_utilities_pma
    restart: always
    environment:
      PMA_HOST: mariadb
    ports:
      - "8081:80"
    depends_on:
      - mariadb

  backend:
    build: ./backend
    container_name: e_utilities_backend
    restart: always
    environment:
      DB_HOST: mariadb
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-apppass}
      DB_NAME: e_utilities_cost
      JWT_SECRET: ${JWT_SECRET:-supersecret2026}
    ports:
      - "3000:3000"
    depends_on:
      - mariadb

  frontend:
    build: ./frontend
    container_name: e_utilities_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mariadb_data:
